services:
  postgres:
    image: postgres:16-alpine
    container_name: instant-mech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-instantmech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-instantmech}
      POSTGRES_DB: ${POSTGRES_DB:-instantmech}
    ports:
      # host 5455 -> container 5432 (5432-5444 are commonly taken locally)
      - "${POSTGRES_PORT:-5455}:5432"
    volumes:
      - instant-mech-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-instantmech} -d ${POSTGRES_DB:-instantmech}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  instant-mech-pgdata:
